id: hackrf
title: HackRF One
vendor: Great Scott Gadgets
part: HackRF One
usb_vendor: "1d50"
usb_product: "6089"
soapy_driver: hackrf
device_name: HackRF One
baud: null
# ISM test tone for attenuated cable loopback only. Do not radiate from an antenna.
center_hz: 915000000
sample_rate: 2000000
tone_offset_hz: 100000
rx_lna_db: 16
rx_vga_db: 16
txvga_db: 0
max_tx_db: 4
max_tx_ms: 200
rx_ms: 400
min_snr_db: 10.0
requires_env: HIL_LOOPBACK
control_buses:
  - id: usb
    role: program
    tool: libhackrf
  - id: soapy
    role: runtime
    tool: SoapySDR
image_paths:
  - id: tx-rx-loopback
    primary: true
    note: SMA cable through attenuator, TX port to RX port. Set HIL_LOOPBACK=1.
phase_seeds_s:
  fixture: 2
  tx: 1
  rx: 2
  analyze: 1
