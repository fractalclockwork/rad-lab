name: check

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Pytest and fixture
        run: make check
      - name: Simulated image stage
        run: |
          # Exercise gates + simulated HWIL image without USB hardware.
          # HackRF image is cross-board and stays closed until Pluto image passes.
          python - <<'PY'
          from harness import radboards
          for board in ("pluto", "hackrf"):
              radboards.write_stage(board, "present", {"status": "pass", "stage": "present"})
              radboards.write_stage(board, "workflow", {"status": "pass", "stage": "workflow"})
          PY
          HUMAN_LOOPBACK=1 RAD_LAB_HWIL_SIM=1 make hwil BOARD=pluto
          HUMAN_LOOPBACK=1 RAD_LAB_HWIL_SIM=1 make hwil BOARD=hackrf

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDR image
        run: make image
