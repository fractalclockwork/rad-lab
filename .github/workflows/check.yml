name: check

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Pytest and fixture
        run: make check
      - name: Simulated image stage
        env:
          PYTHONPATH: hil/scripts
        run: |
          # Exercise gates + simulated HIL without USB hardware.
          python - <<'PY'
          import radboards
          radboards.write_stage("hackrf", "present", {"status": "pass", "stage": "present"})
          radboards.write_stage("hackrf", "workflow", {"status": "pass", "stage": "workflow"})
          PY
          HIL_LOOPBACK=1 RAD_LAB_HIL_SIM=1 make hil BOARD=hackrf

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDR image
        run: make image
